name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 17/11/2026 23:59 (Europe/Madrid, UTC+1) = 22:59 UTC. Les altres hores són reintents.
    - cron: '59 22 17 11 *'
    - cron: '20 23 17 11 *'
    - cron: '0 0 18 11 *'
    - cron: '0 7 18 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Tria què es publica (la web o la pàgina caducada)
        id: pick
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "2026-11-17T22:58:00Z" +%s)" ]; then
            echo "dir=caducada" >> "$GITHUB_OUTPUT"
          else
            echo "dir=site" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.pick.outputs.dir }}
      - id: deploy
        uses: actions/deploy-pages@v5
